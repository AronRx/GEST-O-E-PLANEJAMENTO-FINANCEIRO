<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nymbrio-error.log
    CustomLog ${APACHE_LOG_DIR}/nymbrio-access.log combined
</VirtualHost>
